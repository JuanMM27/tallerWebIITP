<div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; min-height: 100vh;">
  
  <!-- Encabezado de la Tienda -->
  <header style="text-align: center; margin-bottom: 40px; background: #2c3e50; color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <h1 style="margin: 0; font-size: 32px;">☕ {{ title }}</h1>
    <p style="margin: 10px 0 0 0; color: #bdc3c7; font-size: 16px;">Nuestra selección especial de café directo a tu taza</p>
  </header>

  <!-- ⚡ LÓGICA CON SIGNALS: Si el arreglo está vacío, mostramos cargando o vacío -->
  @if (products().length === 0) {
    <div style="text-align: center; padding: 50px;">
      <p style="font-size: 18px; color: #555; font-weight: bold;">Cargando catálogo de cafés o no hay productos...</p>
    </div>
  } @else {
    <!-- Grilla moderna de productos -->
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">
      <!-- Ojo al detalle: a las Signals se las llama con paréntesis products() -->
      @for (p of products(); track p._id) {
        <div style="background: white; border: 1px solid #e1e1e1; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between;">
          
          <div>
            <img [src]="p.imagen" [alt]="p.nombre" style="width: 100%; height: 180px; object-fit: cover;">
            
            <div style="padding: 20px;">
              <!-- Clasificación y Gramaje -->
              <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                <span style="background-color: #34495e; color: white; padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: bold;">
                  {{ p.clasificacion }}
                </span>
                <span style="background-color: #e67e22; color: white; padding: 3px 8px; font-size: 11px; border-radius: 4px; font-weight: bold;">
                  {{ p.gramaje }}
                </span>
              </div>

              <h3 style="margin: 0 0 10px 0; color: #2c3e50; font-size: 20px;">{{ p.nombre }}</h3>
              
              <p style="color: #666; font-size: 14px; line-height: 1.4; margin: 0; height: 60px; overflow: hidden;">
                {{ p.descripcion }}
              </p>
            </div>
          </div>

          <!-- Pie de tarjeta -->
          <div style="padding: 15px 20px; background-color: #fdfdfd; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; color: #27ae60; font-size: 20px;">${{ p.precio }}</span>
            <button style="background-color: #27ae60; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px;">
              Agregar al Carrito
            </button>
          </div>

        </div>
      }
    </div>
  }

</div>
